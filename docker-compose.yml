services:
  hermes-preconfigure:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-preconfigure
    command: python3 /tmp/preconfigure.py
    volumes:
      - hermes-home:/home/hermes/.hermes
      # Script to set password hash and configure MCP server
      - ./preconfigure.py:/tmp/preconfigure.py:ro
    environment:
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD:-hermes}
      - HERMES_WEBUI_USERNAME=${HERMES_WEBUI_USERNAME:-admin}
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=${UID:-1000}
      - HERMES_GID=${GID:-1000}
      - LLM_API_MODEL=${LLM_API_MODEL:-}
      - LLM_API_ENDPOINT=${LLM_API_ENDPOINT:-http://model-runner.docker.internal/v1}
      - LLM_API_KEY=${LLM_API_KEY:-None}
      - MCP_GATEWAY_AUTH_TOKEN=${MCP_GATEWAY_AUTH_TOKEN:-hermes-mcp-server}
      - HERMES_USE_HINDSIGHT=${HERMES_USE_HINDSIGHT:-false}
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY:-hermes-memory-server}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "4.0"
    restart: no
    networks:
      - hermes-net
    env_file:
      - .env

  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    depends_on:
      hermes-preconfigure:
        condition: service_completed_successfully
        restart: true
    command: gateway run
    ports:
      - "${SERVER_PORT:-127.0.0.1:8642}:8642"
    volumes:
      # Persist config, state, sessions, skills, memory across restarts
      - hermes-home:/home/hermes/.hermes
      # Expose agent source so the WebUI can install dependencies from it
      - hermes-agent-src:/opt/hermes
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=${UID:-1000}
      - HERMES_GID=${GID:-1000}
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${HERMES_API_AUTH_TOKEN:-hermes-api-server}
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY:-hermes-memory-server}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8642/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    networks:
      - hermes-net
    env_file:
      - .env

  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    container_name: hermes-webui
    depends_on:
      hermes-agent:
        condition: service_healthy
    ports:
      - "${WEBUI_PORT:-127.0.0.1:8787}:8787"
    volumes:
      - hermes-home:/home/hermeswebui/.hermes
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro
      - ${HOME}/${HERMES_WORKSPACE:-Workspace}:/workspace
    environment:
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD:-hermes}
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - HERMES_API_URL=http://hermes-agent:8642
      - HERMES_API_TOKEN=${HERMES_API_AUTH_TOKEN:-hermes-api-server}
      - WANTED_UID=${UID:-1000}
      - WANTED_GID=${GID:-1000}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - hermes-net
    env_file:
      - .env
    profiles:
      - webui
      - all

  hermes-dashboard:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-dashboard
    command: dashboard --host 0.0.0.0 --insecure
    ports:
      - "${DASHBOARD_PORT:-127.0.0.1:9119}:9119"
    volumes:
      - hermes-home:/home/hermes/.hermes
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=${UID:-1000}
      - HERMES_GID=${GID:-1000}
      - GATEWAY_HEALTH_URL=http://hermes-agent:8642
    depends_on:
      hermes-agent:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    networks:
      - hermes-net
    env_file:
      - .env
    profiles:
      - dashboard
      - all

  mcp-gateway:
    image: docker/mcp-gateway:latest
    container_name: mcp-gateway
    depends_on:
      hermes-agent:
        condition: service_started
    restart: unless-stopped
    command:
      - --profile=${DOCKER_MCP_PROFILE:-default}
      - --transport=sse
      - --port=8811
    ports:
      - "${MCP_PORT:-127.0.0.1:8811}:8811"
    environment:
      - DOCKER_MCP_IN_CONTAINER=1
      - DOCKER_CONTEXT=default 
      - MCP_GATEWAY_AUTH_TOKEN=${MCP_GATEWAY_AUTH_TOKEN:-hermes-mcp-server}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/mcp:/root/.docker/mcp:ro
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - hermes-net
    env_file:
      - .env
    profiles:
      - mcp
      - all

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight
    depends_on:
      hermes-agent:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${HINDSIGHT_PORT:-127.0.0.1:8888}:8888"
      - "${HINDSIGHT_WEBUI_PORT:-127.0.0.1:9999}:9999"
    environment:
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY:-hermes-memory-server}
      - HINDSIGHT_API_PORT=8888
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    volumes:
      - hermes-memory:/home/hindsight/.pg0
    networks:
      - hermes-net
    env_file:
      - .env
    profiles:
      - memory
      - all
      
networks:
  hermes-net:
    driver: bridge

volumes:
  hermes-home:
  hermes-agent-src:
  hermes-memory: